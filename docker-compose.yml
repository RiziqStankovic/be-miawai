services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:25017:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:25017/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
  lightpanda:
    image: lightpanda/browser:nightly
    container_name: lightpanda
    command: ["lightpanda", "serve", "--host", "0.0.0.0", "--port", "9222", "--log_level", "debug"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9222:9222" 